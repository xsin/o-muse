<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0F1E"/>
      <stop offset="100%" stop-color="#141C30"/>
    </linearGradient>

    <!-- 图标底板渐变 -->
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C2542"/>
      <stop offset="100%" stop-color="#121A30"/>
    </linearGradient>

    <!-- 均衡器柱状渐变（青绿 → 紫） -->
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- 主标题文字渐变 -->
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>

    <!-- 青色发光 -->
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <!-- 紫色角落光斑 -->
    <radialGradient id="glowPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <!-- 背景细网格 -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1080" cy="560" r="360" fill="url(#glowPurple)"/>

  <!-- 图标背后的青色光晕 -->
  <circle cx="240" cy="315" r="230" fill="url(#glowCyan)"/>

  <!-- 图标底板 -->
  <rect x="120" y="195" width="240" height="240" rx="56"
        fill="url(#panelGrad)" stroke="#2C3A5C" stroke-width="1.5"/>
  <!-- 底板顶部高光 -->
  <rect x="136" y="211" width="208" height="1.5" rx="0.75"
        fill="#FFFFFF" fill-opacity="0.08"/>

  <!-- 均衡器柱状（7 根） -->
  <g fill="url(#barGrad)">
    <rect x="162" y="340" width="12" height="55"  rx="6"/>
    <rect x="186" y="290" width="12" height="105" rx="6"/>
    <rect x="210" y="320" width="12" height="75"  rx="6"/>
    <rect x="234" y="245" width="12" height="150" rx="6"/>
    <rect x="258" y="300" width="12" height="95"  rx="6"/>
    <rect x="282" y="270" width="12" height="125" rx="6"/>
    <rect x="306" y="335" width="12" height="60"  rx="6"/>
  </g>

  <!-- 主标题 -->
  <text x="440" y="260"
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="94" font-weight="700" letter-spacing="-2"
        fill="url(#textGrad)">Music Rig</text>

  <!-- 副标题 -->
  <text x="443" y="312"
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="22" font-weight="500" letter-spacing="5"
        fill="#67E8F9">THE MUSICIAN'S TOOLKIT</text>

  <!-- 分隔线 -->
  <line x1="443" y1="349" x2="700" y2="349" stroke="#2C3A5C" stroke-width="1.5"/>

  <!-- 功能列表 -->
  <text x="443" y="387"
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="20" font-weight="400"
        fill="#94A3B8">Stem Separation · Kontakt Libraries · Plugin Scanning</text>

  <!-- 持续进化提示 -->
  <text x="443" y="425"
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="19" font-weight="600" letter-spacing="0.5"
        fill="#5EEAD4">New tools added regularly — one subscription, endless tools</text>
</svg>