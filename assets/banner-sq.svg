<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <linearGradient id="sqBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0F1E"/>
      <stop offset="100%" stop-color="#141C30"/>
    </linearGradient>
    <linearGradient id="sqPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C2542"/>
      <stop offset="100%" stop-color="#121A30"/>
    </linearGradient>
    <linearGradient id="sqBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="sqText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>
    <radialGradient id="sqGlowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sqGlowPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="sqGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
    <clipPath id="sqPanelClip">
      <rect x="420" y="220" width="360" height="360" rx="84"/>
    </clipPath>
  </defs>

  <rect width="1200" height="1200" fill="url(#sqBg)"/>
  <rect width="1200" height="1200" fill="url(#sqGrid)"/>
  <circle cx="1050" cy="1080" r="480" fill="url(#sqGlowPurple)"/>
  <circle cx="600" cy="420" r="380" fill="url(#sqGlowCyan)"/>

  <rect x="420" y="220" width="360" height="360" rx="84"
        fill="url(#sqPanel)" stroke="#2C3A5C" stroke-width="1.5"/>

  <!-- 顶部高光横线：裁进圆角内 -->
  <rect x="420" y="240" width="360" height="2"
        clip-path="url(#sqPanelClip)"
        fill="#FFFFFF" fill-opacity="0.08"/>

  <g fill="url(#sqBar)">
    <rect x="478" y="430" width="18" height="85"  rx="9"/>
    <rect x="516" y="350" width="18" height="165" rx="9"/>
    <rect x="554" y="395" width="18" height="120" rx="9"/>
    <rect x="592" y="290" width="18" height="225" rx="9"/>
    <rect x="630" y="370" width="18" height="145" rx="9"/>
    <rect x="668" y="320" width="18" height="195" rx="9"/>
    <rect x="706" y="418" width="18" height="97"  rx="9"/>
  </g>

  <text x="600" y="720" text-anchor="middle"
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="104" font-weight="700" letter-spacing="-2"
        fill="url(#sqText)">O Muse</text>

  <text x="600" y="778" text-anchor="middle"
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="24" font-weight="600" letter-spacing="6"
        fill="#67E8F9">THE MUSICIAN'S TOOLKIT</text>

  <line x1="430" y1="830" x2="770" y2="830" stroke="#2C3A5C" stroke-width="1.5"/>

  <text x="600" y="884" text-anchor="middle"
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="22" font-weight="400"
        fill="#94A3B8">Stem Separation · Kontakt Libraries · Plugin Scanning</text>

  <text x="600" y="932" text-anchor="middle"
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="21" font-weight="600" letter-spacing="0.5"
        fill="#5EEAD4">New tools added regularly — one subscription, endless tools</text>
</svg>