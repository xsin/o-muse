<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>O Muse — 工具箱</title>
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<script>try{var s=localStorage.getItem('musicrig-side');if(s)document.documentElement.dataset.side=s;}catch(e){}</script>
<style>
:root{
  color-scheme:light;
  --n-0:#fff;--n-50:#f8f9fb;--n-100:#f1f3f7;--n-200:#e4e7ee;--n-300:#cdd2dd;
  --n-400:#9aa2b1;--n-500:#6b7280;--n-600:#4a5262;--n-700:#333a48;--n-800:#1f2530;--n-900:#12161d;
  --brand:#3b5bfd;--brand-h:#2f4ce0;--brand-bg:#eef1ff;
  --ok:#12855f;--ok-bg:#e6f6f0;--err:#c0392b;--err-bg:#fdecea;--warn:#a86a00;--warn-bg:#fff4e0;
  --sh-sm:0 1px 2px rgba(18,22,29,.05);
  --sh-md:0 1px 2px rgba(18,22,29,.04),0 2px 8px rgba(18,22,29,.06);
  --topbar-bg:rgba(248,249,251,.85);
}
[data-theme="dark"]{
  color-scheme:dark;
  --n-0:#1a1f28;--n-50:#0f1319;--n-100:#232a35;--n-200:#2d3542;--n-300:#3a4351;
  --n-400:#6b7280;--n-500:#9aa2b1;--n-600:#b8bfcc;--n-700:#cdd2dd;--n-800:#e4e7ee;--n-900:#f1f3f7;
  --brand:#6b85ff;--brand-h:#8499ff;--brand-bg:rgba(107,133,255,.14);
  --ok:#34d399;--ok-bg:rgba(52,211,153,.14);--err:#f87171;--err-bg:rgba(248,113,113,.14);
  --warn:#fbbf24;--warn-bg:rgba(251,191,36,.14);
  --sh-sm:0 1px 2px rgba(0,0,0,.4);--sh-md:0 1px 2px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.35);
  --topbar-bg:rgba(15,19,25,.85);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;--n-0:#1a1f28;--n-50:#0f1319;--n-100:#232a35;--n-200:#2d3542;--n-300:#3a4351;
    --n-400:#6b7280;--n-500:#9aa2b1;--n-600:#b8bfcc;--n-700:#cdd2dd;--n-800:#e4e7ee;--n-900:#f1f3f7;
    --brand:#6b85ff;--brand-h:#8499ff;--brand-bg:rgba(107,133,255,.14);
    --ok:#34d399;--ok-bg:rgba(52,211,153,.14);--err:#f87171;--err-bg:rgba(248,113,113,.14);
    --warn:#fbbf24;--warn-bg:rgba(251,191,36,.14);
    --sh-sm:0 1px 2px rgba(0,0,0,.4);--sh-md:0 1px 2px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.35);
    --topbar-bg:rgba(15,19,25,.85);
  }
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--n-50);color:var(--n-800);line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-size:14px;
  transition:background-color .18s,color .18s}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
button{font:inherit;cursor:pointer;color:inherit}

/* ── shell ── */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--n-0);border-right:1px solid var(--n-200);
  padding:20px 12px;display:flex;flex-direction:column;gap:4px;
  position:sticky;top:0;height:100vh;transition:background-color .18s,border-color .18s}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;
  color:var(--n-900);padding:8px 12px;margin-bottom:12px}
.brand .logo{width:24px;height:24px;flex-shrink:0;border-radius:6px}
.nav-label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--n-400);padding:14px 12px 6px}
.nav-item{display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;
  border-radius:8px;color:var(--n-600);font-size:13.5px;transition:background .12s,color .12s;
  border:0;background:transparent;width:100%;text-align:left}
.nav-item svg{flex-shrink:0;opacity:.75}
.nav-item:hover{background:var(--n-100);color:var(--n-900)}
.nav-item.on{background:var(--brand-bg);color:var(--brand);font-weight:500}
.nav-item.on svg{opacity:1}
.nav-item .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .x{margin-left:auto;width:20px;height:20px;border-radius:6px;display:none;
  align-items:center;justify-content:center;color:var(--n-400)}
.nav-item.tab:hover .x{display:flex}
.nav-item .x:hover{background:var(--err-bg);color:var(--err)}
.nav-badge{margin-left:auto;font-size:11px;font-weight:600;padding:1px 6px;
  border-radius:999px;background:var(--warn-bg);color:var(--warn)}
.side-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--n-200)}
.user{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;cursor:pointer}
.user:hover{background:var(--n-100)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--brand);color:var(--n-50);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
[data-theme="dark"] .avatar{color:#0f1319}
.user-meta{font-size:12.5px;line-height:1.3;overflow:hidden}
.user-meta b{display:block;font-weight:500;color:var(--n-800)}
.user-meta span{color:var(--n-400);font-size:11.5px}

/* 侧栏两段式收起：s0 完整 → s1 仅图标 → s2 完全隐藏（单一切换钮，与 demo 一致） */
[data-side="1"] .app{grid-template-columns:64px 1fr}
[data-side="1"] .side{padding:20px 10px}
[data-side="1"] .brand{justify-content:center;padding:8px 0}
[data-side="1"] .brand .txt,[data-side="1"] .nav-label,[data-side="1"] .nav-item .txt,
[data-side="1"] .nav-badge,[data-side="1"] .user-meta{display:none}
[data-side="1"] .nav-item{justify-content:center;padding:0}
[data-side="1"] .user{justify-content:center;padding:8px 0}
[data-side="2"] .app{grid-template-columns:1fr}
[data-side="2"] .side{display:none}

/* ── main ── */
.main{min-width:0;display:flex;flex-direction:column;position:relative;background:transparent}
#bg{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
.topbar{position:sticky;top:0;z-index:5;background:var(--topbar-bg);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--n-200);
  padding:0 28px;height:60px;display:flex;align-items:center;gap:14px;
  transition:background-color .18s,border-color .18s}
.topbar .crumb{font-size:12.5px;color:var(--n-400)}
.topbar h1{font-size:16px;font-weight:600;margin:0;color:var(--n-900);letter-spacing:-.01em}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.theme-toggle{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;color:var(--n-500);border:1px solid var(--n-200);
  background:var(--n-0);cursor:pointer;transition:all .15s;flex-shrink:0}
.theme-toggle:hover{color:var(--n-900);border-color:var(--n-300)}
.theme-toggle .sun{display:none}
[data-theme="dark"] .theme-toggle .sun{display:block}
[data-theme="dark"] .theme-toggle .moon{display:none}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .theme-toggle .sun{display:block}
  :root:not([data-theme="light"]) .theme-toggle .moon{display:none}
}
.lang-toggle{width:auto;min-width:36px;padding:0 10px;font-weight:600;font-size:13px}
.content{position:relative;z-index:1;padding:24px 28px 48px;display:flex;flex-direction:column;gap:20px}
.hero{background:linear-gradient(120deg,var(--brand-bg),transparent);border:1px solid var(--n-200);
  border-radius:14px;padding:22px 24px}
.hero h2{margin:0 0 6px;font-size:18px;color:var(--n-900)}
.hero p{margin:0;color:var(--n-500);font-size:13px}
/* 让 GLSL 向日葵透出：背景卡片半透明 */
.hero,.card,.panel{backdrop-filter:blur(2px);background-color:color-mix(in srgb,var(--n-0) 82%,transparent)}

/* ── app cards ── */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--n-0);border:1px solid var(--n-200);border-radius:12px;padding:20px;
  display:flex;flex-direction:column;gap:12px;transition:border-color .2s,box-shadow .2s,transform .12s;position:relative}
.card.enabled{cursor:pointer}
.card.enabled:hover{border-color:var(--brand);box-shadow:var(--sh-md);transform:translateY(-2px)}
.card .ic{width:40px;height:40px;border-radius:10px;background:var(--brand-bg);color:var(--brand);
  display:flex;align-items:center;justify-content:center}
.card h3{margin:0;font-size:15.5px;color:var(--n-900)}
.card .sub{font-size:12px;color:var(--brand);font-weight:500}
.card p{margin:0;font-size:12.5px;color:var(--n-500);flex:1}
.card .soon{position:absolute;inset:0;border-radius:12px;background:rgba(120,120,130,.06);
  display:flex;align-items:flex-start;justify-content:flex-end;padding:12px}
.card .soon span{font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-bg);padding:3px 8px;border-radius:999px}
.card.disabled{opacity:.7}

/* ── app panels ── */
.panel{background:var(--n-0);border:1px solid var(--n-200);border-radius:12px;overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--n-200)}
.panel-head h2{font-size:14px;font-weight:600;margin:0;color:var(--n-900)}
.panel-head .sub{font-size:12px;font-weight:500;color:var(--brand)}
.panel-body{padding:20px}
.drop{border:2px dashed var(--n-300);border-radius:12px;padding:48px 20px;text-align:center;color:var(--n-500);
  background:var(--n-50);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  color:var(--n-400);padding:10px 20px;border-bottom:1px solid var(--n-200);background:var(--n-50)}
td{padding:12px 20px;border-bottom:1px solid var(--n-200);color:var(--n-700)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:999px}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.err{background:var(--err-bg);color:var(--err)} .tag i{width:5px;height:5px;border-radius:50%;background:currentColor}
.lock{text-align:center;padding:60px 20px;color:var(--n-500)}
.lock svg{color:var(--n-400);margin-bottom:12px}
</style>
</head>
<body>
<div class="app">
  <!-- ── left rail ── -->
  <aside class="side">
    <div class="brand">
      <!-- 内联 assets/logo.svg（波形渐变），避免相对路径/打开方式导致的加载失败 -->
      <svg class="logo" viewBox="0 0 512 512" width="24" height="24" role="img" aria-label="O Muse">
        <defs>
          <linearGradient id="waveGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#5EEAD4"/>
            <stop offset="100%" stop-color="#8B5CF6"/>
          </linearGradient>
        </defs>
        <g fill="url(#waveGrad)">
          <rect x="77"  y="298" width="28" height="128" rx="14"/>
          <rect x="132" y="181" width="28" height="245" rx="14"/>
          <rect x="187" y="247" width="28" height="179" rx="14"/>
          <rect x="242" y="86"  width="28" height="340" rx="14"/>
          <rect x="297" y="210" width="28" height="216" rx="14"/>
          <rect x="352" y="141" width="28" height="285" rx="14"/>
          <rect x="407" y="280" width="28" height="146" rx="14"/>
        </g>
      </svg>
      <span class="txt" id="brand-txt">O Muse</span>
    </div>

    <div class="nav-label" id="nav-nav">导航</div>
    <button class="nav-item on" id="nav-market" data-view="market">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span class="txt" id="market-txt">工具箱</span>
    </button>

    <div class="nav-label" id="opened-txt">已打开</div>
    <div id="open-tabs"></div>

    <div class="side-foot">
      <div class="user" id="user">
        <div class="avatar">MR</div>
        <div class="user-meta"><b id="user-name">本地用户</b><span id="user-tier">Free</span></div>
      </div>
    </div>
  </aside>

  <!-- ── main ── -->
  <main class="main">
    <canvas id="bg"></canvas>
    <div class="topbar">
      <button class="theme-toggle side-toggle" id="side-toggle" aria-label="收起侧栏" title="收起侧栏">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      </button>
      <span class="crumb" id="crumb">O Muse</span>
      <h1 id="title">工具箱</h1>
      <div class="top-actions">
        <button class="theme-toggle lang-toggle" id="lang-toggle" aria-label="切换语言">中</button>
        <button class="theme-toggle" id="theme-toggle" aria-label="切换主题">
          <svg class="moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
          <svg class="sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<script>
(function(){
  var r=document.documentElement;

  /* ── data (App Registry — ids only; strings from i18n, see tdd.md §3.1/§4.1) ── */
  var APPS = {
    stemdeck:  {id:'stemdeck', enabled:true,
                icon:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>'},
    libraries: {id:'libraries', enabled:true,
                icon:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>'},
    plugins:   {id:'plugins', enabled:false,
                icon:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>'}
  };

  /* ── i18n dictionaries (zh-CN default + en-US) — see ADR-0004 / PRD FR-8 ── */
  var I18N = {
    'zh-CN':{
      brand:'O Muse', market:'工具箱', opened:'已打开', nav:'导航', collapse:'收起侧栏',
      welcome:'欢迎来到 O Muse 工具箱',
      welcomeSub:'点击任意 App 即可打开；可同时打开多个 App，并在左侧随时切换。',
      soon:'即将推出',
      user:{name:'本地用户', tier:'Free'},
      apps:{
        stemdeck:{name:'StemDeck', sub:'音频分轨', desc:'将整曲拆分为人声 / 鼓 / 贝斯 / 其他 stems，本地运行、隐私优先。'},
        libraries:{name:'Kontakt Library Manager', sub:'Kontakt 音源库管理', desc:'只读盘点你的 Kontakt 音源库，诊断缺失路径、重复 SNPID、断卷。'},
        plugins:{name:'Audio Plugin Manager', sub:'音频插件管理', desc:'扫描与管理 AU / VST / VST3 / AAX / CLAP 插件。'}
      },
      stem:{drop:'将音频文件拖放到此处，或点击选择文件以开始分轨', local:'本地处理 · 不联网上传'}
    },
    'en-US':{
      brand:'O Muse', market:'Toolbox', opened:'Open', nav:'Navigate', collapse:'Collapse sidebar',
      welcome:'Welcome to the O Muse Toolbox',
      welcomeSub:'Click any App to open it; open several at once and switch from the left rail.',
      soon:'Coming soon',
      user:{name:'Local User', tier:'Free'},
      apps:{
        stemdeck:{name:'StemDeck', sub:'Audio Separation', desc:'Split a track into vocals / drums / bass / other stems — local, privacy-first.'},
        libraries:{name:'Kontakt Library Manager', sub:'Kontakt Libraries', desc:'Read-only inventory of your Kontakt libraries; diagnose missing paths, duplicate SNPID, disconnected volumes.'},
        plugins:{name:'Audio Plugin Manager', sub:'Audio Plugins', desc:'Scan and manage AU / VST / VST3 / AAX / CLAP plugins.'}
      },
      stem:{drop:'Drop an audio file here, or click to choose a file to start separation', local:'Processed locally · no upload'}
    }
  };
  var lang = (function(){ try{var l=localStorage.getItem('ui_lang'); if(l) return l;}catch(e){}
    return (navigator.language||'en').toLowerCase().indexOf('zh')===0 ? 'zh-CN' : 'en-US'; })();
  function t(k){ return k.split('.').reduce(function(o,x){return o&&o[x];},I18N[lang]) || k; }
  function setLang(l){ lang=l; document.documentElement.lang=l; try{localStorage.setItem('ui_lang',l)}catch(e){} render(); updateLangBtn(); }

  var openTabs = [];        // array of app ids currently open
  var activeView = 'market'; // 'market' | app id

  var content = document.getElementById('content');
  var tabsEl  = document.getElementById('open-tabs');
  var titleEl = document.getElementById('title');
  var crumbEl = document.getElementById('crumb');
  var marketBtn = document.getElementById('nav-market');

  function render(){
    /* left rail tabs */
    tabsEl.innerHTML='';
    openTabs.forEach(function(id){
      var a=APPS[id];
      var b=document.createElement('button');
      b.className='nav-item tab'+(activeView===id?' on':'');
      b.dataset.view=id;
      b.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">'+a.icon+'</svg>'+
                  '<span class="txt">'+t('apps.'+id+'.name')+'</span>'+
                  '<span class="x" data-close="'+id+'" title="关闭">✕</span>';
      b.addEventListener('click',function(e){
        if(e.target.dataset.close){ closeTab(e.target.dataset.close); }
        else { activeView=id; render(); }
      });
      tabsEl.appendChild(b);
    });

    /* market btn state */
    marketBtn.className='nav-item'+(activeView==='market'?' on':'');

    /* i18n static labels */
    document.getElementById('brand-txt').textContent=t('brand');
    document.getElementById('nav-nav').textContent=t('nav');
    document.getElementById('market-txt').textContent=t('market');
    document.getElementById('opened-txt').textContent=t('opened');
    document.getElementById('user-name').textContent=t('user.name');
    document.getElementById('user-tier').textContent=t('user.tier');

    /* main */
    if(activeView==='market') renderMarket();
    else renderApp(activeView);
  }

  function renderMarket(){
    titleEl.textContent=t('market');
    crumbEl.textContent=t('brand');
    var cards = Object.keys(APPS).map(function(id){
      var a=APPS[id], s=t('apps.'+id);
      var cls = a.enabled ? 'card enabled' : 'card disabled';
      var soon = a.enabled ? '' : '<div class="soon"><span>'+t('soon')+'</span></div>';
      return '<div class="'+cls+'" data-open="'+id+'">'+
               '<div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">'+a.icon+'</svg></div>'+
               '<div class="sub">'+s.sub+'</div>'+
               '<h3>'+s.name+'</h3>'+
               '<p>'+s.desc+'</p>'+
               soon+
             '</div>';
    }).join('');
    content.innerHTML =
      '<div class="hero"><h2>'+t('welcome')+'</h2>'+
      '<p>'+t('welcomeSub')+'</p></div>'+
      '<div class="cards">'+cards+'</div>';

    content.querySelectorAll('.card.enabled').forEach(function(c){
      c.addEventListener('click',function(){ openApp(c.dataset.open); });
    });
  }

  function renderApp(id){
    var a=APPS[id], s=t('apps.'+id);
    titleEl.textContent=s.name;
    crumbEl.textContent=t('brand')+' / '+s.sub;
    var body;
    if(id==='stemdeck'){
      body='<div class="drop">'+t('stem.drop')+'<br><small style="color:var(--n-400)">'+t('stem.local')+'</small></div>'+
           '<div style="margin-top:16px"><table><thead><tr><th>任务</th><th>状态</th><th>进度</th></tr></thead>'+
           '<tbody><tr><td class="mono">demo-track.wav</td><td><span class="tag ok"><i></i>完成</span></td><td>100%</td></tr></tbody></table></div>';
    } else if(id==='libraries'){
      body='<table><thead><tr><th>音源库</th><th>状态</th><th>诊断</th><th>路径</th></tr></thead><tbody>'+
           '<tr><td>Stradivari Cello</td><td><span class="tag ok"><i></i>已注册</span></td><td><span class="tag ok"><i></i>正常</span></td><td class="mono">/Library/...</td></tr>'+
           '<tr><td>NOIRE Piano</td><td><span class="tag ok"><i></i>已注册</span></td><td><span class="tag warn"><i></i>路径缺失</span></td><td class="mono">/Volumes/Ext/...</td></tr>'+
           '<tr><td>Arkhitklt</td><td><span class="tag warn"><i></i>未注册</span></td><td><span class="tag err"><i></i>重复 SNPID</span></td><td class="mono">/Library/...</td></tr>'+
           '</tbody></table>';
    } else {
      body='<div class="lock"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>'+
           '<div style="font-size:15px;color:var(--n-700);font-weight:500">'+s.name+' · '+t('soon')+'</div>'+
           '<div style="font-size:12.5px;margin-top:6px">将在 v1.1 上线（扫描 AU / VST / VST3 / AAX / CLAP 插件）</div></div>';
    }
    content.innerHTML='<div class="panel"><div class="panel-head"><h2>'+s.name+'</h2><span class="sub">'+s.sub+'</span></div><div class="panel-body">'+body+'</div></div>';
  }

  function openApp(id){
    if(!APPS[id].enabled) return;
    if(openTabs.indexOf(id)===-1) openTabs.push(id);
    activeView=id;
    render();
  }
  function closeTab(id){
    openTabs=openTabs.filter(function(x){return x!==id;});
    if(activeView===id) activeView = openTabs.length? openTabs[openTabs.length-1] : 'market';
    render();
  }

  marketBtn.addEventListener('click',function(){ activeView='market'; render(); });

  /* language toggle (i18n — ADR-0004), top-right */
  var lt=document.getElementById('lang-toggle');
  function updateLangBtn(){ lt.textContent = lang==='zh-CN'?'中':'EN'; }
  lt.addEventListener('click',function(){ setLang(lang==='zh-CN'?'en-US':'zh-CN'); });
  updateLangBtn();

  /* theme toggle (top-right) + sidebar collapse (top-left) — faithful to reference demo */
  var tt=document.getElementById('theme-toggle');
  tt.addEventListener('click',function(){
    var cur=r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
    var next=cur==='dark'?'light':'dark';
    r.dataset.theme=next;try{localStorage.setItem('theme',next)}catch(e){}
  });

  var st=document.getElementById('side-toggle'),side=parseInt(r.dataset.side||'0',10)||0;
  function applySide(){
    r.dataset.side=String(side);try{localStorage.setItem('musicrig-side',String(side))}catch(e){}
    /* 单一切换钮：0 完整 → 1 仅图标 → 2 完全隐藏 → 回到 0（与 demo 一致） */
    var lbl=side===0?'收起侧栏':(side===1?'再点一次完全隐藏侧栏':'展开侧栏');
    st.title=lbl;st.setAttribute('aria-label',lbl);
  }
  st.addEventListener('click',function(){side=side>=2?0:side+1;applySide();});
  applySide();

  render();
})();

/* ── GLSL Van Gogh "Sunflowers" background (right pane) ── */
(function(){
  var cv=document.getElementById('bg');
  if(!cv) return;
  var gl=cv.getContext('webgl')||cv.getContext('experimental-webgl');
  if(!gl){ cv.style.display='none'; return; }

  var vs='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
  var fs=[
    'precision highp float;',
    'uniform vec2 u;     // resolution',
    'uniform float t;    // time',
    'float hash(vec2 p){return fract(sin(dot(p,vec2(41.3,289.1)))*43758.5);}',
    'float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);',
    ' float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));',
    ' return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}',
    'float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n2(p);p*=2.03;a*=.5;}return v;}',
    // 朝某点发散的笔触场（梵高式漩涡）
    'vec2 swirl(vec2 uv,vec2 c,float k){vec2 d=uv-c;float r=length(d);float a=atan(d.y,d.x);',
    ' a+=k/(r+0.25)+t*0.05;return vec2(cos(a),sin(a))*r+d*0.;}',
    'void main(){',
    ' vec2 uv=gl_FragCoord.xy/u;',
    ' vec2 p=(gl_FragCoord.xy-0.5*u)/u.y;',   // 居中坐标，y 向上
    ' float asp=u.x/u.y;',
    // 背景：暖黄绿相间的油彩，随笔触流动
    ' vec2 q=swirl(p,vec2(0.0,-0.05),0.6);',
    ' float bg=fbm(q*3.0+vec2(t*0.03,0.0));',
    ' vec3 warm=mix(vec3(0.93,0.78,0.30),vec3(0.86,0.62,0.18),bg);',   // 向日葵黄
    ' vec3 cool=mix(vec3(0.30,0.45,0.36),vec3(0.18,0.30,0.26),bg);',   // 橄榄绿
    ' vec3 col=mix(cool,warm,smoothstep(0.2,0.7,bg));',
    // 桌面/花瓶区（下方偏中）：青绿釉 vase
    ' float vase=smoothstep(0.16,0.12,abs(p.x))*smoothstep(-0.25,-0.05,p.y)*smoothstep(-0.55,-0.30,p.y);',
    ' col=mix(col,vec3(0.12,0.34,0.34),vase*0.85);',
    // 花头：多朵向日葵
    ' vec2 heads[5];',
    ' heads[0]=vec2(-0.22,0.30);heads[1]=vec2(0.05,0.42);heads[2]=vec2(0.30,0.28);',
    ' heads[3]=vec2(-0.05,0.16);heads[4]=vec2(0.18,0.10);',
    ' for(int i=0;i<5;i++){',
    '   vec2 h=heads[i];float rr=length(p-h);',
    '   float petal=fbm(q*8.0+float(i)*3.7);',      // 花瓣旋转的纹理
    '   float disc=smoothstep(0.115,0.085,rr);',    // 花盘
    '   float ring=smoothstep(0.20,0.13,rr)-disc;', // 花瓣环
    '   vec3 petalCol=mix(vec3(0.95,0.72,0.16),vec3(0.80,0.45,0.10),petal);',
    '   vec3 discCol=mix(vec3(0.30,0.18,0.08),vec3(0.12,0.07,0.03),fbm(h*20.0));',
    '   col=mix(col,petalCol,ring*0.95);',
    '   col=mix(col,discCol,disc);',
    ' }',
    // 笔触高光（细碎亮纹）
    ' float stroke=fbm(q*14.0-vec2(0.0,t*0.1));',
    ' col+=vec3(0.06,0.05,0.02)*smoothstep(0.6,0.95,stroke);',
    // 暗角
    ' float vig=smoothstep(1.0,0.35,length(p*vec2(1.0,1.1)));',
    ' col*=mix(0.78,1.0,vig);',
    // 轻微暗化，保证前景文字可读
    ' col*=0.62;',
    ' gl_FragColor=vec4(col,1.0);',
    '}'
  ].join('\n');

  function sh(type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.warn('shader',gl.getShaderInfoLog(s));return null;}return s;}
  var vsS=sh(gl.VERTEX_SHADER,vs),fsS=sh(gl.FRAGMENT_SHADER,fs);
  if(!vsS||!fsS){cv.style.display='none';return;}
  var pr=gl.createProgram();gl.attachShader(pr,vsS);gl.attachShader(pr,fsS);gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){cv.style.display='none';return;}
  gl.useProgram(pr);
  var buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  var loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  var uU=gl.getUniformLocation(pr,'u'),uT=gl.getUniformLocation(pr,'t');

  function resize(){var d=window.devicePixelRatio||1;
    var w=cv.clientWidth||cv.parentNode.clientWidth,h=cv.clientHeight||cv.parentNode.clientHeight;
    cv.width=Math.max(1,Math.floor(w*d));cv.height=Math.max(1,Math.floor(h*d));
    gl.viewport(0,0,cv.width,cv.height);}
  window.addEventListener('resize',resize);resize();
  // 侧栏收起时 main 宽度变化，下一帧重算
  var st=document.getElementById('side-toggle');
  st&&st.addEventListener('click',function(){setTimeout(resize,60);});

  var start=performance.now();
  (function loop(now){
    gl.uniform2f(uU,cv.width,cv.height);
    gl.uniform1f(uT,(now-start)/1000);
    gl.drawArrays(gl.TRIANGLES,0,3);
    requestAnimationFrame(loop);
  })(start);
})();
</script>
