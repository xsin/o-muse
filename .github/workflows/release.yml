name: Release (public beta, ad-hoc signing)

# 触发：推送 v* 标签。公测阶段不购买 Apple Developer Program，
# 因此使用 ad-hoc 签名 + zip 分发（见 docs/tech-release-without-developer-id.md）。
#
# 托管：产物发布到 gh-pages 分支的 releases/ 下，由 GitHub Pages 提供服务：
#   https://xsin.github.io/o-muse/releases/latest/install.sh
# 安装脚本同时兼容 <version>/ 与 <version>/download/ 两种路径布局，
# 因此将来若迁到 GitHub Releases 附件，安装脚本无需改动。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      force_version:
        description: "覆盖版本号（留空则从 tauri.conf.json 读取）"
        required: false

permissions:
  contents: write   # 推送 gh-pages 分支所需

jobs:
  build-and-publish:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 版本号单一来源：src-tauri/tauri.conf.json
      - name: Read version from tauri.conf.json
        id: ver
        run: |
          VERSION="$(bash scripts/release/lib/version.sh version)"
          if [ -n "${{ github.event.inputs.force_version }}" ]; then
            VERSION="${{ github.event.inputs.force_version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME:-v$VERSION}" >> "$GITHUB_OUTPUT"
          echo "O Muse version: $VERSION"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      # universal 需要两个 target；缺一个时 build.sh 自动退化为单架构包
      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install frontend deps
        run: npm ci

      # 关键环境变量（公测阶段默认值）：
      #   SIGN_IDENTITY="-"  → ad-hoc 签名；将来改为 Developer ID Application 证书
      #   NOTARIZE=0         → 不公证；将来改为 1 并提供 APPLE_ID/TEAM_ID/APP_SPECIFIC_PASSWORD
      - name: Build, ad-hoc sign, verify, package
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY || '-' }}
          NOTARIZE: ${{ secrets.NOTARIZE || '0' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/site"
          bash scripts/release/build.sh \
            --arch universal \
            --out-dir "$RUNNER_TEMP/site/releases/${{ steps.ver.outputs.version }}"
          echo "=== artifacts ==="
          ls -l "$RUNNER_TEMP/site/releases/${{ steps.ver.outputs.version }}"

      # 发布前必须复核交付物本身的签名（从 zip 解出再验）
      - name: Verify ad-hoc signature of shipped zip
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          rm -rf verify && mkdir verify
          V="${{ steps.ver.outputs.version }}"
          ditto -x -k "site/releases/$V/O Muse-$V-universal.zip" verify/
          codesign --verify --deep --strict --verbose=2 "verify/O Muse.app"
          echo "signature verification passed"

      # latest/ 入口：install.sh + VERSION.txt + checksums.txt
      - name: Stage latest entry points
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          SITE="$RUNNER_TEMP/site"
          mkdir -p "$SITE/releases/latest"
          cp scripts/release/install.sh        "$SITE/releases/latest/install.sh"
          cp "$SITE/releases/$V/checksums.txt" "$SITE/releases/latest/checksums.txt"
          echo "$V" > "$SITE/releases/latest/VERSION.txt"

      # 推送到 gh-pages 分支（GitHub Pages 需在仓库设置里开启，指向该分支根目录）
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/site"
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b gh-pages
          git add -A
          git commit -q -m "release: O Muse ${{ steps.ver.outputs.version }} (public beta)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "published to gh-pages"

      # 同时生成 GitHub Release：gh-pages 是"安装通道"（可变 latest），
      # Release 是"版本归档"（不可变 + 变更说明 + 人工下载入口 + 关注者通知）。
      # 两者由同一次构建产出，内容一致，不会分叉。
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"
          DIR="$RUNNER_TEMP/site/releases/$V"

          # tag 已存在则先删 Release 再重建，保证 workflow 可重复执行
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" -y || true
          # 同时清掉可能已存在的同名远端 tag，避免 tag 指向旧提交
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "O Muse ${V} (public beta)" \
            --notes "公测版：ad-hoc 签名分发，未经 Apple 公证。

**安装（推荐）**

\`\`\`bash
curl -fsSL https://xsin.github.io/o-muse/releases/latest/install.sh | bash
\`\`\`

**手动下载**：见下方 Assets。首次打开若被 Gatekeeper 阻止，请右键 → 打开，
或执行 \`xattr -dr com.apple.quarantine ~/Applications/O\\ Muse.app\`。

完整说明见 [docs/tech-release-without-developer-id.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/tech-release-without-developer-id.md)。" \
            --generate-notes

          # 归档产物（与 gh-pages 同一份构建产物）
          for f in "$DIR"/*; do
            [ -e "$f" ] || continue
            gh release upload "$TAG" "$f" --clobber
          done

          # install.sh 与 VERSION.txt 也作为 release asset 上传：
          # 这样把基址指向 Releases 时，latest 解析可通过 GitHub 的
          # /releases/latest/download/VERSION.txt 别名生效。
          cp scripts/release/install.sh "$RUNNER_TEMP/install.sh"
          gh release upload "$TAG" "$RUNNER_TEMP/install.sh" --clobber
          gh release upload "$TAG" "$RUNNER_TEMP/site/releases/latest/VERSION.txt" --clobber

          echo "=== release assets ==="
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'

      - name: Summary
        run: |
          V="${{ steps.ver.outputs.version }}"
          {
            echo "### O Muse ${V} (public beta) 已发布"
            echo ""
            echo "**安装通道** — gh-pages（\`latest\` 可变指针）："
            echo '```bash'
            echo "curl -fsSL https://xsin.github.io/o-muse/releases/latest/install.sh | bash"
            echo '```'
            echo "**版本归档** — GitHub Release：https://github.com/${GITHUB_REPOSITORY}/releases/tag/${{ steps.ver.outputs.tag }}"
          } >> "$GITHUB_STEP_SUMMARY"
