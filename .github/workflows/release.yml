name: Release (public beta, ad-hoc signing)

# 触发：推送 v* 标签。公测阶段不购买 Apple Developer Program，
# 因此使用 ad-hoc 签名 + zip 分发（见 docs/tech-release-without-developer-id.md）。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空则从 tauri.conf.json 读取）"
        required: false

permissions:
  contents: write   # 上传 Release 产物所需

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 版本号单一来源：src-tauri/tauri.conf.json
      - name: Read version from tauri.conf.json
        id: ver
        run: |
          VERSION="$(bash scripts/release/lib/version.sh version)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME:-$VERSION}" >> "$GITHUB_OUTPUT"
          echo "Music Rig version: $VERSION"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Rust target：universal 需要两个 target；缺一个则自动退化为单架构
      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install frontend deps
        run: npm ci

      # 关键环境变量（公测阶段默认值）：
      #   SIGN_IDENTITY="-"  → ad-hoc 签名；将来改为 Developer ID Application 证书
      #   NOTARIZE=0         → 不公证；将来改为 1 并提供 APPLE_ID/TEAM_ID/APP_SPECIFIC_PASSWORD
      - name: Build, ad-hoc sign, verify, package
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY || '-' }}
          NOTARIZE: ${{ secrets.NOTARIZE || '0' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/releases"
          bash scripts/release/build.sh \
            --arch universal \
            --out-dir "$RUNNER_TEMP/releases/${{ steps.ver.outputs.version }}"
          echo "=== artifacts ==="
          ls -l "$RUNNER_TEMP/releases/${{ steps.ver.outputs.version }}"

      - name: Verify ad-hoc signature (must pass before publish)
        run: |
          set -euo pipefail
          # 从 zip 解出 .app 复核，确保交付物本身签名有效
          cd "$RUNNER_TEMP"
          rm -rf verify && mkdir verify
          APP="${{ steps.ver.outputs.version }}"
          ditto -x -k "releases/$APP/Music Rig-$APP-universal.zip" verify/
          codesign --verify --deep --strict --verbose=2 "verify/Music Rig.app"
          echo "signature verification passed"

      # 把 install.sh 与 checksums 放进 latest/ 并一起上传
      - name: Stage latest install.sh
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          STAGE="$RUNNER_TEMP/releases"
          mkdir -p "$STAGE/latest"
          cp scripts/release/install.sh "$STAGE/latest/install.sh"
          cp "$STAGE/$VERSION/checksums.txt" "$STAGE/latest/checksums.txt"

      - name: Upload to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"
          STAGE="$RUNNER_TEMP/releases"

          # tag 已存在则先删再建，保证可重复执行（workflow_dispatch 重跑）
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" -y || true
          gh release create "$TAG" \
            --title "Music Rig ${VERSION} (public beta)" \
            --notes "公测版：ad-hoc 签名分发，未经 Apple 公证。安装：curl -fsSL <base>/releases/latest/install.sh | bash" \
            --generate-notes

          # 版本化产物
          for f in "$STAGE/$VERSION"/*; do
            [ -e "$f" ] || continue
            gh release upload "$TAG" "$f" --clobber
          done
          # latest 稳定入口：install.sh + checksums.txt
          for f in "$STAGE/latest"/*; do
            [ -e "$f" ] || continue
            gh release upload "$TAG" "$f" --clobber
          done

          echo "published:"
          gh release view "$TAG" --json assets --jq '.assets[].name'
